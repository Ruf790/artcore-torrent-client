# Builds ArtCoreClient.exe + Setup.exe on Windows.
# Every push / PR: artifacts on the run page (Actions → run → Artifacts).
# Publishing a release on GitHub (Releases → Draft a new release → tag v1.2.3 → Publish):
# the installer and a portable zip are built and attached to that release.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Check version matches the release tag
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}".TrimStart("v", "V")
          $code = (Select-String -Path artcore/__init__.py -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $iss = (Select-String -Path setup.iss -Pattern '#define AppVersion\s+"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $code -or $tag -ne $iss) {
            Write-Error "Release tag $tag does not match the code version (artcore/__init__.py: $code, setup.iss: $iss). Merge the version bump first, then publish the release again."
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Smoke test (imports + engine)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import libtorrent as lt; from artcore import engine, ui, winint; print('libtorrent', lt.__version__)"

      - name: Self-update launcher test (quoting through cmd.exe)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "upd test"
          New-Item -ItemType Directory -Force $d | Out-Null
          Set-Content (Join-Path $d "Setup.bat") "@echo %* > `"$d\marker.txt`""
          python -c "import sys, subprocess; sys.path.insert(0, '.'); from artcore.updater import installer_cmdline as c; print(c(sys.argv[1])); subprocess.Popen(c(sys.argv[1]), creationflags=0x08000000).wait()" (Join-Path $d "Setup.bat")
          Start-Sleep -Seconds 10
          $m = Join-Path $d "marker.txt"
          if (-not (Test-Path $m)) { Write-Error "installer was not started"; exit 1 }
          Get-Content $m
          if (-not (Select-String -Path $m -Pattern "/SILENT" -Quiet)) { Write-Error "arguments lost"; exit 1 }

      - name: Render icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_icon.py

      - name: PyInstaller
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name ArtCoreClient
          --icon assets/icon.ico
          --version-file version_info.txt
          --add-data "assets;assets"
          --collect-binaries libtorrent
          --collect-data qtawesome
          --collect-submodules windows_toasts --collect-submodules winrt
          --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtQuickWidgets
          --exclude-module PySide6.QtQuick3D
          --exclude-module PySide6.QtQuickControls2
          --exclude-module PySide6.QtOpenGL
          --exclude-module PySide6.QtOpenGLWidgets
          --exclude-module PySide6.QtPdf
          --exclude-module PySide6.QtPdfWidgets
          --exclude-module PySide6.QtDataVisualization
          --exclude-module PySide6.QtCharts
          --exclude-module PySide6.QtGraphs
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtWebChannel
          --exclude-module PySide6.QtWebSockets
          --exclude-module PySide6.QtMultimedia
          --exclude-module PySide6.QtMultimediaWidgets
          --exclude-module PySide6.QtSql
          --exclude-module PySide6.QtTest
          --exclude-module PySide6.QtDesigner
          --exclude-module PySide6.QtHelp
          --exclude-module PySide6.QtBluetooth
          --exclude-module PySide6.QtPositioning
          --exclude-module PySide6.QtLocation
          --exclude-module PySide6.QtSensors
          --exclude-module PySide6.QtSerialPort
          --exclude-module PySide6.QtSvgWidgets
          --exclude-module PySide6.Qt3DCore
          --exclude-module PySide6.QtScxml
          --exclude-module PySide6.QtStateMachine
          --exclude-module PySide6.QtTextToSpeech
          --exclude-module PySide6.QtRemoteObjects
          --exclude-module PySide6.QtNfc
          --exclude-module PySide6.QtSpatialAudio
          --exclude-module PySide6.QtHttpServer
          run.py

      - name: Trim unused Qt parts
        run: python tools/trim_build.py dist/ArtCoreClient

      - name: Self-test the built exe
        shell: pwsh
        run: |
          Remove-Item "$env:TEMP\artcore_selftest.txt" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\ArtCoreClient\ArtCoreClient.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\artcore_selftest.txt"
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed (exit $($p.ExitCode))"; exit 1 }
          $mb = [math]::Round(((Get-ChildItem dist\ArtCoreClient -Recurse | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "dist size: $mb MB"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/ArtCoreClient/LICENSE.txt
          Copy-Item COPYING dist/ArtCoreClient/COPYING.txt
          Copy-Item THIRD-PARTY.md dist/ArtCoreClient/THIRD-PARTY.txt
          # portable mode: settings and torrents live in .\Data next to the exe
          Set-Content dist/ArtCoreClient/portable.ini "[ArtCore]`r`n; delete this file to use %APPDATA%\ArtCoreClient"
          Compress-Archive -Path dist/ArtCoreClient -DestinationPath installer/ArtCoreClient-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ArtCoreClient-${{ github.sha }}
          path: installer/*

      # gh release upload only adds files to an existing release — it never creates one
      # (an old run finishing after the release was deleted must not bring it back)
      - name: Attach to the published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" installer/* --clobber --repo "${{ github.repository }}"
