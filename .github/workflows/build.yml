# Builds ArtCoreClient.exe + Setup.exe on Windows.
# Every push / PR: artifacts on the run page (Actions → run → Artifacts).
# Tag v1.2.3: also publishes a GitHub Release with the installer and a portable zip.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Smoke test (imports + engine)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import libtorrent as lt; from artcore import engine, ui, winint; print('libtorrent', lt.__version__)"

      - name: Render icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_icon.py

      - name: PyInstaller
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name ArtCoreClient
          --icon assets/icon.ico
          --version-file version_info.txt
          --add-data "assets;assets"
          --collect-binaries libtorrent
          --collect-data qtawesome
          run.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/ArtCoreClient -DestinationPath installer/ArtCoreClient-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ArtCoreClient-${{ github.sha }}
          path: installer/*

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*
          generate_release_notes: true
