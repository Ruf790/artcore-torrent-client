# Builds ArtCoreClient.exe + Setup.exe on Windows.
# Every push / PR: artifacts on the run page (Actions → run → Artifacts).
# Publishing a release on GitHub (Releases → Draft a new release → tag v1.2.3 → Publish):
# the installer and a portable zip are built and attached to that release.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Check version matches the release tag
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}".TrimStart("v", "V")
          $code = (Select-String -Path artcore/__init__.py -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $iss = (Select-String -Path setup.iss -Pattern '#define AppVersion\s+"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $code -or $tag -ne $iss) {
            Write-Error "Release tag $tag does not match the code version (artcore/__init__.py: $code, setup.iss: $iss). Merge the version bump first, then publish the release again."
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Smoke test (imports + engine)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import libtorrent as lt; from artcore import engine, ui, winint; print('libtorrent', lt.__version__)"

      - name: Render icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_icon.py

      - name: PyInstaller
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name ArtCoreClient
          --icon assets/icon.ico
          --version-file version_info.txt
          --add-data "assets;assets"
          --collect-binaries libtorrent
          --collect-data qtawesome
          run.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/ArtCoreClient -DestinationPath installer/ArtCoreClient-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ArtCoreClient-${{ github.sha }}
          path: installer/*

      # gh release upload only adds files to an existing release — it never creates one
      # (an old run finishing after the release was deleted must not bring it back)
      - name: Attach to the published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" installer/* --clobber --repo "${{ github.repository }}"
